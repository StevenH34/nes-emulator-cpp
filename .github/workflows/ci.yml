name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # Tells vcpkg to use the GitHub Actions cache as its binary cache, so already-built packages
  # (SDL3 and its from-source dependencies) are restored instead of rebuilt on every run.
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pull from the official LLVM apt repo instead of the distro's.
      - name: Install clang-format
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y clang-format-19

      - name: Check formatting
        run: |
          find src tests -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \
            | xargs clang-format-19 --dry-run --Werror

  sanitizers:
    name: ASan/UBSan tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Required by vcpkg's x-gha binary cache provider to authenticate against the GitHub
      # Actions cache service. See https://learn.microsoft.com/vcpkg/consume/binary-caching-github-actions
      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Package list below is SDL's own documented Linux build-dependency list (https://wiki.libsdl.org/SDL3/README-linux),
      # plus autotools for the vcpkg-built pieces.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git make pkg-config ninja-build \
            gcc-14 g++-14 \
            autoconf autoconf-archive automake libtool libltdl-dev \
            gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libfribidi-dev \
            libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libwayland-dev wayland-protocols libdecor-0-dev liburing-dev

      # Caches the vcpkg tool itself (its git clone + bootstrapped binary), separate from the
      # x-gha binary cache above which handles the packages vcpkg builds.
      - name: Cache vcpkg tool
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            !${{ env.VCPKG_ROOT }}/buildtrees
            !${{ env.VCPKG_ROOT }}/downloads
            !${{ env.VCPKG_ROOT }}/packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          if [ ! -f "${{ env.VCPKG_ROOT }}/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg "${{ env.VCPKG_ROOT }}"
          fi
          "${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh"

      - name: Configure (asan preset)
        run: cmake --preset asan -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14

      - name: Build tests
        run: cmake --build cmake-build-asan --target nes_emulator_tests

      - name: Run tests under ASan/UBSan
        working-directory: cmake-build-asan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./nes_emulator_tests
