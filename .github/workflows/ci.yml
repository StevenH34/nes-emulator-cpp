name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  sanitizers:
    name: ASan/UBSan tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SDL3's default vcpkg features on x64-linux (dbus, ibus, wayland, x11) pull in a chunk of
      # the Linux desktop stack. Some of it (dbus, libsystemd, libxcrypt, libmount, ...) is built
      # from source by vcpkg and needs autotools on the PATH; SDL3 itself is built by vcpkg too,
      # but links its X11/Wayland/EGL/audio backends directly against system dev packages rather
      # than vcpkg-built ones. Package list below is SDL's own documented Linux build-dependency
      # list (https://wiki.libsdl.org/SDL3/README-linux), plus autotools for the vcpkg-built pieces.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git make pkg-config ninja-build \
            gcc-14 g++-14 \
            autoconf autoconf-archive automake libtool libltdl-dev \
            gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libfribidi-dev \
            libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libwayland-dev wayland-protocols libdecor-0-dev liburing-dev

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            !${{ env.VCPKG_ROOT }}/buildtrees
            !${{ env.VCPKG_ROOT }}/downloads
            !${{ env.VCPKG_ROOT }}/packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          if [ ! -f "${{ env.VCPKG_ROOT }}/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg "${{ env.VCPKG_ROOT }}"
          fi
          "${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh"

      # ubuntu-latest's default g++ (13) predates <print>/std::print support (added in GCC 14's
      # libstdc++); point our own project sources at g++-14. SDL3 is a C library built by vcpkg
      # with the default system compiler above, so this doesn't affect that step.
      - name: Configure (asan preset)
        run: cmake --preset asan -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14

      - name: Build tests
        run: cmake --build cmake-build-asan --target nes_emulator_tests

      - name: Run tests under ASan/UBSan
        working-directory: cmake-build-asan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./nes_emulator_tests
