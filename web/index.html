<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NES Emulator</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
      background: #1e1e1e;
      color: #ddd;
      font-family: system-ui, sans-serif;
    }
    #canvas {
      background: #000;
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
    }
    #status.error {
      color: #f66;
    }
    #controls {
      display: grid;
      grid-template-columns: auto auto;
      gap: 4px 16px;
      margin: 0;
      font-size: 14px;
    }
    #controls dt {
      text-align: right;
    }
    #controls dd {
      margin: 0;
      color: #999;
    }
    kbd {
      padding: 1px 6px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #2a2a2a;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="768" height="720" oncontextmenu="event.preventDefault()"></canvas>
  <label>
    Load ROM: <input type="file" id="rom-input" accept=".nes" disabled>
  </label>
  <div id="status">Loading emulator…</div>
  <!-- Mirrors WasmApp::KeyMap(). -->
  <dl id="controls">
    <dt><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd></dt><dd>D-pad</dd>
    <dt><kbd>Z</kbd></dt><dd>A</dd>
    <dt><kbd>X</kbd></dt><dd>B</dd>
    <dt><kbd>Enter</kbd></dt><dd>Start</dd>
    <dt><kbd>Shift</kbd></dt><dd>Select</dd>
  </dl>

  <script src="nes_emulator_wasm.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
